<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>خاص</title>

<style>
body{
    margin:0;
    height:100vh;
    background-image: url("/static/saja.png");
    background-size: cover;
    background-position: center;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: Arial;
}

.box{
    background: rgba(255,255,255,0.75);
    padding:40px;
    width:320px;
    text-align:center;
    border-radius:25px;
    animation: fade 1.5s;
}

h2{
    color: purple;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    font-size:20px;
    text-align:center;
    border-radius:12px;
    border:2px solid purple;
}

button{
    margin-top:20px;
    padding:10px 40px;
    font-size:18px;
    border-radius:12px;
    border:none;
    background: purple;
    color:white;
    cursor:pointer;
}

@keyframes fade{
    from{opacity:0; transform:scale(0.8);}
    to{opacity:1; transform:scale(1);}
}
</style>
</head>

<body>

<div class="box">
    <h2>إلى الدكتورة سجى العظيمة 💜</h2>

    <form method="post">
        <input type="password" name="password" placeholder="كلمة السر">
        <button>دخول</button>
    </form>
</div>

</body>
</html>
